version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"
    groups:
      patch:
        update-types:
          - "patch"
